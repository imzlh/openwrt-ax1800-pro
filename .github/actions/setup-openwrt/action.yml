name: Install OpenWrt build dependencies
description: Shared dependencies for firmware builds and preparation smoke checks
runs:
  using: composite
  steps:
    - name: Install packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libelf-dev libncurses-dev libssl-dev \
          python3 python3-setuptools python3-dev rsync swig unzip zlib1g-dev \
          file wget curl ca-certificates subversion patch diffutils tar gzip \
          bzip2 xz-utils zstd cpio time xsltproc libxml-parser-perl
