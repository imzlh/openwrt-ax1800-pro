name: Build AX1800 Pro (24.x and 25.x)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-matrix.yml'
      - 'config/**'
      - 'files/**'
      - 'patches/**'
      - 'scripts/**'
      - 'sources.lock.json'
  workflow_dispatch:
    inputs:
      jobs:
        description: '编译并发数'
        type: choice
        default: 'auto'
        options: ['auto', '2', '3', '4', '8']

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: ax1800pro-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: OpenWrt ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 24.10.8
            commit: 0b795ce79e23b553aa184080c390f9ce92a2b6d4
          - version: 25.12.5
            commit: f0a60eee2fe051741c643ea6118718aae1ef17fb
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TZ: Asia/Shanghai
      REQUESTED_JOBS: ${{ inputs.jobs || 'auto' }}
      CCACHE_DIR: ${{ github.workspace }}/openwrt-${{ matrix.version }}/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPILERCHECK: content
      OPENWRT_VERSION: ${{ matrix.version }}
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select build parallelism and check disk space
        run: |
          case "$REQUESTED_JOBS" in
            auto) build_jobs=$(nproc) ;;
            2|3|4|8) build_jobs=$REQUESTED_JOBS ;;
            *) echo "Unsupported parallelism: $REQUESTED_JOBS" >&2; exit 1 ;;
          esac
          echo "BUILD_JOBS=$build_jobs" >> "$GITHUB_ENV"
          required_kb=$((25 * 1024 * 1024))
          available_kb=$(df --output=avail "$GITHUB_WORKSPACE" | tail -n1)
          if (( available_kb < required_kb )); then
            for directory in /usr/local/lib/android /usr/share/dotnet /opt/ghc; do
              sudo rm -rf -- "$directory"
              available_kb=$(df --output=avail "$GITHUB_WORKSPACE" | tail -n1)
              (( available_kb >= required_kb )) && break
            done
          fi
          (( available_kb >= required_kb )) || { df -h; exit 1; }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libelf-dev libncurses-dev libssl-dev python3 python3-setuptools \
            python3-dev rsync swig unzip zlib1g-dev file wget curl ca-certificates \
            subversion patch diffutils tar gzip bzip2 xz-utils zstd cpio time \
            xsltproc libxml-parser-perl

      - name: Prepare official source and device patches
        run: |
          python3 - "$OPENWRT_VERSION" "$GITHUB_WORKSPACE/sources.lock.json" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[2])
          data = json.loads(p.read_text())
          data["openwrt"]["version"] = sys.argv[1]
          data["openwrt"]["commit"] = {
              "24.10.8": "0b795ce79e23b553aa184080c390f9ce92a2b6d4",
              "25.12.5": "f0a60eee2fe051741c643ea6118718aae1ef17fb",
          }[sys.argv[1]]
          p.write_text(json.dumps(data, indent=2) + "\n")
          PY
          mkdir -p artifacts/logs
          bash scripts/prepare.sh "${GITHUB_WORKSPACE}/openwrt-${OPENWRT_VERSION}" 2>&1 | tee artifacts/logs/prepare.log

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: openwrt-${{ matrix.version }}/.ccache
          key: openwrt-ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.version }}-${{ hashFiles('sources.lock.json') }}

      - name: Download sources
        run: |
          set -o pipefail
          make -C "openwrt-${OPENWRT_VERSION}" download -j8 V=s 2>&1 | tee artifacts/logs/download.log

      - name: Compile firmware
        run: |
          set -o pipefail
          make -C "openwrt-${OPENWRT_VERSION}" -j"$BUILD_JOBS" BUILD_LOG=1 2>&1 | tee artifacts/logs/build.log

      - name: Verify firmware and copy output
        run: |
          python3 scripts/check-config.py "openwrt-${OPENWRT_VERSION}/.config"
          python3 scripts/check-firmware.py "openwrt-${OPENWRT_VERSION}/bin/targets/qualcommax/ipq60xx"
          mkdir -p artifacts/firmware
          cp -a "openwrt-${OPENWRT_VERSION}/bin/targets/qualcommax/ipq60xx/." artifacts/firmware/
          python3 scripts/build-info.py "openwrt-${OPENWRT_VERSION}" artifacts

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openwrt-${{ matrix.version }}-jdcloud-ax1800pro-${{ github.run_number }}
          path: artifacts/firmware/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload logs and build information
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-info-${{ matrix.version }}-${{ github.run_number }}
          path: |
            artifacts/logs/
            artifacts/build-info.json
            artifacts/build.config
            artifacts/feeds.conf.default
            artifacts/local-changes.patch
            openwrt-${{ matrix.version }}/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish verified firmware
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          image=(artifacts/firmware/*jdcloud_re-ss-01*sysupgrade.bin)
          manifest=(artifacts/firmware/*jdcloud_re-ss-01*.manifest)
          [[ ${#image[@]} == 1 && ${#manifest[@]} == 1 ]]
          tag="ax1800pro-v${OPENWRT_VERSION}-build${GITHUB_RUN_NUMBER}"
          mkdir -p artifacts/release
          cp -- "${image[0]}" "${manifest[0]}" artifacts/firmware/profiles.json artifacts/build-info.json artifacts/release/
          (cd artifacts/release && sha256sum ./*.bin > SHA256SUMS)
          gh release create "$tag" artifacts/release/* \
            --target "$GITHUB_SHA" \
            --title "AX1800 Pro OpenWrt ${OPENWRT_VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "JDCloud RE-SS-01 测试固件，OpenWrt ${OPENWRT_VERSION}。"
