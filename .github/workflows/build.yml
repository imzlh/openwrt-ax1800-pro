name: Build AX1800 Pro

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'files/**'
      - 'patches/**'
      - 'scripts/**'
      - 'sources.lock.json'
  workflow_dispatch:
    inputs:
      jobs:
        description: '编译并发数（auto 使用 runner 全部 CPU，内存不足时选 2）'
        type: choice
        default: 'auto'
        options: ['auto', '2', '3', '4', '8']

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: ax1800pro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TZ: Asia/Shanghai
      REQUESTED_JOBS: ${{ inputs.jobs || 'auto' }}
      CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select build parallelism and check disk space
        run: |
          case "$REQUESTED_JOBS" in
            auto) build_jobs=$(nproc) ;;
            2|3|4|8) build_jobs=$REQUESTED_JOBS ;;
            *) echo "Unsupported parallelism: $REQUESTED_JOBS" >&2; exit 1 ;;
          esac
          echo "BUILD_JOBS=$build_jobs" >> "$GITHUB_ENV"
          echo "Using $build_jobs compile jobs on $(nproc) CPUs."
          free -h
          required_kb=$((25 * 1024 * 1024))
          available_kb=$(df --output=avail "$GITHUB_WORKSPACE" | tail -n1)
          if (( available_kb < required_kb )); then
            # Only remove unused SDKs when this disposable VM needs the space.
            for directory in /usr/local/lib/android /usr/share/dotnet /opt/ghc; do
              sudo rm -rf -- "$directory"
              available_kb=$(df --output=avail "$GITHUB_WORKSPACE" | tail -n1)
              if (( available_kb >= required_kb )); then
                break
              fi
            done
          fi
          if (( available_kb < required_kb )); then
            echo 'At least 25 GiB of free space is required.' >&2
            df -h
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libelf-dev libncurses-dev libssl-dev python3 python3-setuptools \
            python3-dev rsync swig unzip zlib1g-dev file wget curl ca-certificates \
            subversion patch diffutils tar gzip bzip2 xz-utils zstd cpio \
            time xsltproc libxml-parser-perl
          df -h "$GITHUB_WORKSPACE"

      - name: Prepare official source and device patches
        run: |
          mkdir -p artifacts/logs
          bash scripts/prepare.sh 2>&1 | tee artifacts/logs/prepare.log

      - name: Restore source download cache
        id: restore_dl
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: openwrt/dl
          key: openwrt-dl-v2-${{ runner.os }}-${{ hashFiles('sources.lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            openwrt-dl-v2-${{ runner.os }}-${{ hashFiles('sources.lock.json') }}-
            openwrt-dl-v2-${{ runner.os }}-
            openwrt-dl-${{ runner.os }}-

      - name: Restore compiler cache
        id: restore_ccache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: openwrt/.ccache
          key: openwrt-ccache-v1-${{ runner.os }}-${{ runner.arch }}-ipq60xx-${{ hashFiles('sources.lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            openwrt-ccache-v1-${{ runner.os }}-${{ runner.arch }}-ipq60xx-${{ hashFiles('sources.lock.json') }}-

      - name: Download sources
        run: |
          set -o pipefail
          make -C openwrt download -j8 V=s 2>&1 | tee artifacts/logs/download.log || \
            make -C openwrt download -j1 V=s 2>&1 | tee artifacts/logs/download-retry.log

      - name: Save downloaded sources even after a failed download
        if: always() && steps.restore_dl.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: openwrt/dl
          key: ${{ steps.restore_dl.outputs.cache-primary-key }}

      - name: Compile firmware
        run: |
          set -o pipefail
          make -C openwrt -j"$BUILD_JOBS" BUILD_LOG=1 2>&1 | tee artifacts/logs/build.log || \
            make -C openwrt -j1 V=s BUILD_LOG=1 2>&1 | tee artifacts/logs/build-retry.log

      - name: Record compiler cache statistics
        if: always()
        continue-on-error: true
        run: |
          if [[ -x openwrt/staging_dir/host/bin/ccache ]]; then
            mkdir -p artifacts/logs
            openwrt/staging_dir/host/bin/ccache --show-stats 2>&1 | tee artifacts/logs/ccache.log
          fi

      - name: Save compiler cache even after a failed build
        if: always() && steps.restore_ccache.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: openwrt/.ccache
          key: ${{ steps.restore_ccache.outputs.cache-primary-key }}

      - name: Verify firmware and copy output
        run: |
          python3 scripts/check-config.py openwrt/.config
          python3 scripts/check-firmware.py openwrt/bin/targets/qualcommax/ipq60xx
          mkdir -p artifacts/firmware
          cp -a openwrt/bin/targets/qualcommax/ipq60xx/. artifacts/firmware/

      - name: Record build sources and configuration
        if: always()
        run: python3 scripts/build-info.py openwrt artifacts

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openwrt-24.10.8-jdcloud-ax1800pro-${{ github.run_number }}
          path: artifacts/firmware/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload logs and build information
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-info-${{ github.run_number }}
          path: |
            artifacts/logs/
            artifacts/build-info.json
            artifacts/build.config
            artifacts/feeds.conf.default
            artifacts/local-changes.patch
            openwrt/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish verified firmware as a prerelease
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(artifacts/firmware/*jdcloud_re-ss-01*sysupgrade.bin)
          manifests=(artifacts/firmware/*jdcloud_re-ss-01*.manifest)
          if (( ${#images[@]} != 1 || ${#manifests[@]} != 1 )); then
            echo 'Expected exactly one verified sysupgrade image and manifest.' >&2
            exit 1
          fi
          version=$(python3 -c 'import json; print(json.load(open("sources.lock.json"))["openwrt"]["version"])')
          tag="ax1800pro-v${version}-build${GITHUB_RUN_NUMBER}-attempt${GITHUB_RUN_ATTEMPT}"
          mkdir -p artifacts/release
          cp -- "${images[0]}" "${manifests[0]}" \
            artifacts/firmware/profiles.json artifacts/build-info.json artifacts/release/
          (cd artifacts/release && sha256sum ./*.bin > SHA256SUMS)
          cat > artifacts/release-notes.md <<'EOF'
          JDCloud RE-SS-01 / AX1800 Pro 测试固件，OpenWrt 24.10.8、Linux 6.6，eMMC ext4 Overlay。

          刷入前核对设备型号、分区标签和镜像 SHA256；先执行 `sysupgrade -T`。
          首次启动后确认 `/overlay` 挂载在 eMMC 上，并重启验证设置持久化。

          设备与 Overlay 说明见仓库 README 和 docs/overlay.md。此构建尚待真机回归。
          EOF
          gh release create "$tag" \
            artifacts/release/*.bin \
            artifacts/release/*.manifest \
            artifacts/release/SHA256SUMS \
            artifacts/release/profiles.json \
            artifacts/release/build-info.json \
            --target "$GITHUB_SHA" \
            --title "AX1800 Pro OpenWrt ${version} (build ${GITHUB_RUN_NUMBER})" \
            --notes-file artifacts/release-notes.md \
            --prerelease
