name: Check project

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - 'files/**'
      - 'patches/**'
      - 'patches-25/**'
      - 'sources.lock.json'
      - 'sources-25.lock.json'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Check script syntax and validators
        run: |
          bash -n scripts/prepare.sh
          sh -n files/etc/uci-defaults/99-project-settings
          shellcheck scripts/prepare.sh files/etc/uci-defaults/99-project-settings
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -v
          python3 -m json.tool sources.lock.json >/dev/null
          python3 -m json.tool sources-25.lock.json >/dev/null
          test -n "$(find patches -maxdepth 1 -name '*.patch' -print -quit)"
          test -n "$(find patches-25 -maxdepth 1 -name '*.patch' -print -quit)"
