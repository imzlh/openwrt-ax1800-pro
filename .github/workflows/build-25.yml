name: Build AX1800 Pro OpenWrt 25.x

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-25.yml', 'config/**', 'files/**', 'patches-25/**', 'scripts/**', 'sources-25.lock.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      VERSION: 25.12.5
      COMMIT: f0a60eee2fe051741c643ea6118718aae1ef17fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: openwrt/dl
          key: openwrt-dl-v2-25.12.5-${{ hashFiles('sources-25.lock.json') }}
          restore-keys: openwrt-dl-v2-25.12.5-
      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: openwrt/.ccache
          key: openwrt-ccache-v2-25.12.5-${{ hashFiles('sources-25.lock.json') }}
          restore-keys: openwrt-ccache-v2-25.12.5-
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libelf-dev libncurses-dev libssl-dev python3 python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget curl ca-certificates subversion patch diffutils tar gzip bzip2 xz-utils zstd cpio time xsltproc libxml-parser-perl
      - name: Prepare and build
        run: |
          cp sources-25.lock.json sources.lock.json
          rm -rf patches
          cp -a patches-25 patches
          bash scripts/prepare.sh openwrt
          make -C openwrt download -j8
          make -C openwrt -j"$(nproc)" BUILD_LOG=1
      - name: Save caches
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: openwrt-cache-v2-25.12.5-${{ github.run_id }}
      - name: Verify and publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          python3 scripts/check-config.py openwrt/.config
          python3 scripts/check-firmware.py openwrt/bin/targets/qualcommax/ipq60xx
          gh release create "ax1800pro-v${VERSION}-build${GITHUB_RUN_NUMBER}" openwrt/bin/targets/qualcommax/ipq60xx/* --target "$GITHUB_SHA" --title "AX1800 Pro OpenWrt ${VERSION} (build ${GITHUB_RUN_NUMBER})" --notes "JDCloud RE-SS-01 测试固件，OpenWrt ${VERSION}。"
